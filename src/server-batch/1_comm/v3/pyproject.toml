[project]
name = "issirt-comm-v3"
version = "3.0.0"
description = "ISS in Real Time - Communication Processing Pipeline v3"
readme = "comm_transcription_v3_plan.md"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies for stage2_transcribe.py
    "whisperx>=3.7.4",
    "torch>=2.5.0,<2.9.dev0",  # Compatible with whisperx 3.7.4 (2.5.1+cu121 for CUDA support)
    "python-dotenv>=1.1.1",
    "rich>=14.2.0",
    "numpy>=1.26.0,<3.0",  # numpy 2.3+ requires Python 3.11+, using 1.26+ for Python 3.10 compatibility
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include all Python files in the current directory
packages = ["."]
only-include = [
    "*.py",
    "comm_transcription_v3_plan.md",
]

[tool.uv]
# UV-specific configuration
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "whisperx.*",
    "torch.*",
    "torchaudio.*",
]
ignore_missing_imports = true
